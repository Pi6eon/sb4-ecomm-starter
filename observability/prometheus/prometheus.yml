global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: shop-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8081"]

  - job_name: shop-bff
    metrics_path: /metrics
    static_configs:
      - targets: ["bff:3001"]
